description: Configuration file for checklist::check_pkg()
package: yes
allowed:
  warnings:
  - motivation: ROR is false positive and INLA is not available on CRAN
    value: "checking CRAN incoming feasibility ... WARNING\nMaintainer: 'Thierry Onkelinx
      <thierry.onkelinx@inbo.be>'\n\nNew submission\n\nStrong dependencies not in
      the CRAN or BioC software repositories:\n  INLA\nAvailability using Additional_repositories
      specification:\n  INLA   yes   https://inla.r-inla-download.org/R/stable\n\nFound
      the following (possibly) invalid ROR IDs:\n  ID: 00j54wy13\t(from: DESCRIPTION)"
  notes: []
required:
- CITATION
- DESCRIPTION
- R CMD check
- checklist
- documentation
- filename conventions
- folder conventions
- license
- lintr
- organisation
- repository secret
- spelling
spelling:
  default: en-GB
  ignore:
  - .github
  - LICENSE.md
pak: []
gha_install: []
